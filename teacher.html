<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AttendX — Teacher</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">

  <aside class="sidebar">
    <div class="sidebar-brand">
      <span class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="8" height="8" rx="2" fill="#fff"/><rect x="13" y="3" width="8" height="8" rx="2" fill="#fff" opacity=".7"/><rect x="3" y="13" width="8" height="8" rx="2" fill="#fff" opacity=".7"/><rect x="13" y="13" width="8" height="8" rx="2" fill="#fff" opacity=".45"/></svg>
      </span>
      <span>AttendX</span>
    </div>
    <div id="sidebarCollege" style="padding:0 8px 16px; margin-top:-14px; font-size:12px; color:#93a3bd;">—</div>

    <div class="nav-section-label">Teaching</div>
    <ul class="nav-list">
      <li><a href="#classes" class="nav-link active" data-route="classes">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="14" rx="2"/><path d="M3 9h18"/><path d="M9 13l2 2 4-4"/></svg>
        My Classes
      </a></li>
    </ul>

    <div class="sidebar-spacer"></div>

    <div class="sidebar-user">
      <div class="avatar" id="sidebarAvatar">DR</div>
      <div class="sidebar-user-info">
        <div class="sidebar-user-name" id="sidebarUserName">—</div>
        <div class="sidebar-user-role" id="sidebarUserRole">—</div>
      </div>
    </div>
    <button class="signout-link" id="signOutBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      Sign out
    </button>
  </aside>

  <main class="main" id="mainContent">
    <!-- rendered by js/teacher.js -->
  </main>

</div>

<div class="toast" id="toast"></div>

<script src="js/data.js"></script>
<script src="js/auth.js"></script>
<script src="js/teacher.js"></script>
</body>
</html>
