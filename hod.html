<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AttendX — HOD</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">

  <aside class="sidebar">

      <span class="brand-mark">

      </span>
      <span>AttendX</span>
    </div>

    <div class="nav-section-label">Management</div>
    <ul class="nav-list">
      <li><a href="#overview" class="nav-link" data-route="overview">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
        Overview
      </a></li>
      <li><a href="#sections" class="nav-link" data-route="sections">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
        Sections
      </a></li>
      <li><a href="#teachers" class="nav-link" data-route="teachers">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg>
        Teachers
      </a></li>
      <li><a href="#students" class="nav-link" data-route="students">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="8" cy="9" r="3.2"/><circle cx="17" cy="10" r="2.6"/><path d="M2.5 21c0-3.6 2.6-6.2 5.5-6.2s5.5 2.6 5.5 6.2M14 21c0-2.8 1.8-5 4-5s4 2.2 4 5"/></svg>
        Students
      </a></li>
    </ul>

    <div class="sidebar-spacer"></div>

    <div class="sidebar-user">
      <div class="avatar" id="sidebarAvatar">DA</div>
      <div class="sidebar-user-info">
        <div class="sidebar-user-name" id="sidebarUserName">—</div>
        <div class="sidebar-user-role" id="sidebarUserRole">—</div>
      </div>
    </div>
    <button class="signout-link" id="signOutBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      Sign out
    </button>
  </aside>

  <main class="main" id="mainContent">
    <!-- rendered by js/hod.js -->
  </main>

</div>

<div class="toast" id="toast"></div>

<script src="js/data.js"></script>
<script src="js/auth.js"></script>
<script src="js/hod.js"></script>
</body>
</html>
