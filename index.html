<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AttendX — Find your college</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="login-wrap">
  <div class="login-card">
    <div class="login-brand">
      <span class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="8" height="8" rx="2" fill="#fff"/><rect x="13" y="3" width="8" height="8" rx="2" fill="#fff" opacity=".7"/><rect x="3" y="13" width="8" height="8" rx="2" fill="#fff" opacity=".7"/><rect x="13" y="13" width="8" height="8" rx="2" fill="#fff" opacity=".45"/></svg>
      </span>
      <span>AttendX</span>
    </div>
    <div class="login-sub">Enter your college code to continue</div>

    <div class="login-error" id="collegeError">College code not recognized.</div>

    <form id="collegeForm" novalidate>
      <div class="field">
        <label for="collegeCode">College code</label>
        <input type="text" id="collegeCode" placeholder="e.g. GEC24" required autocomplete="off" style="text-transform:uppercase;">
      </div>
      <button type="submit" class="btn btn-primary btn-block" style="padding:11px;">Continue</button>
    </form>

    <div class="demo-box">
      <h4>Demo colleges</h4>
      <div id="collegeList"></div>
    </div>
  </div>
</div>

<script src="js/data.js"></script>
<script>
  DB.init();

  // If a user is already signed in, skip straight to their dashboard.
  (function () {
    const u = DB.getCurrentUser();
    if (u) window.location.href = u.role === 'hod' ? 'hod.html' : 'teacher.html';
  })();

  const form = document.getElementById('collegeForm');
  const errorBox = document.getElementById('collegeError');
  const codeInput = document.getElementById('collegeCode');
  const listEl = document.getElementById('collegeList');

  function goToLogin(collegeId) {
    DB.setSelectedCollege(collegeId);
    window.location.href = 'login.html';
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    const college = DB.collegeByCode(codeInput.value);
    if (!college) {
      errorBox.classList.add('show');
      return;
    }
    errorBox.classList.remove('show');
    goToLogin(college.id);
  });

  // Render the list of demo colleges as quick "Use" buttons, same pattern
  // as the demo-account buttons on the login page.
  listEl.innerHTML = DB.getColleges().map(c => `
    <div class="demo-account">
      <div>
        <span class="who">${c.name}</span>
        <span class="em">Code: ${c.code}</span>
      </div>
      <button type="button" data-college="${c.id}">Use</button>
    </div>
  `).join('');

  listEl.querySelectorAll('button[data-college]').forEach(btn => {
    btn.addEventListener('click', () => goToLogin(btn.dataset.college));
  });
</script>
</body>
</html>
