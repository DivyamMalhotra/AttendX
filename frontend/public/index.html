<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#F6F5F0">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<title>AttendX — Find your college</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="login-wrap">
  <main class="login-card">
    <div class="login-brand"><span class="brand-mark"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="3" y="3" width="8" height="8" rx="2" fill="#fff"/><rect x="13" y="3" width="8" height="8" rx="2" fill="#fff" opacity=".7"/><rect x="3" y="13" width="8" height="8" rx="2" fill="#fff" opacity=".7"/><rect x="13" y="13" width="8" height="8" rx="2" fill="#fff" opacity=".45"/></svg></span><span class="name">AttendX</span></div>
    <div class="login-sub">Enter your college code to continue</div>
    <div class="login-error" id="collegeError" role="alert">College code not recognized.</div>
    <form id="collegeForm" novalidate>
      <div class="field">
        <label for="collegeCode">College code</label>
        <input type="text" id="collegeCode" placeholder="e.g. GEC24" required autocomplete="off" autocapitalize="characters" style="text-transform:uppercase" maxlength="20">
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="continueBtn">Continue</button>
    </form>
    <p class="login-footnote">Your college administrator can tell you the code.</p>
  </main>
</div>
<script type="module" src="js/pages/auth/college.js"></script>
</body>
</html>
