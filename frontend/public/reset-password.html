<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#F6F5F0">
<link rel="manifest" href="/manifest.webmanifest">
<title>AttendX — Set a new password</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="login-wrap">
  <main class="login-card">
    <div class="login-brand"><span class="name">AttendX</span></div>
    <div class="login-sub">Choose a new password</div>
    <div class="login-error" id="msgError" role="alert"></div>
    <form id="resetForm" novalidate>
      <div class="field"><label for="pw1">New password</label><input type="password" id="pw1" required autocomplete="new-password">
        <div class="field-hint">At least 8 characters, with letters and a number.</div></div>
      <div class="field"><label for="pw2">Repeat new password</label><input type="password" id="pw2" required autocomplete="new-password"></div>
      <button type="submit" class="btn btn-primary btn-block" id="saveBtn">Update password</button>
    </form>
    <div style="text-align:center; margin-top:16px;"><a class="btn-link" href="login.html">&larr; Back to sign in</a></div>
  </main>
</div>
<script type="module" src="js/pages/auth/resetPassword.js"></script>
</body>
</html>
