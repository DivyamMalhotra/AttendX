<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#F6F5F0">
<link rel="manifest" href="/manifest.webmanifest">
<title>AttendX — Forgot password</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="login-wrap">
  <main class="login-card">
    <div class="login-brand"><span class="name">AttendX</span></div>
    <div class="login-sub">Enter your email and we will send a link to set a new password.</div>
    <div class="login-error" id="msgError" role="alert"></div>
    <div class="notice notice-success hidden" id="msgDone" role="status"><div>If that account exists, a reset link has been sent to its email address. The link works for 30 minutes.</div></div>
    <form id="forgotForm" novalidate>
      <div class="field"><label for="email">Email</label><input type="email" id="email" required autocomplete="username"></div>
      <button type="submit" class="btn btn-primary btn-block" id="sendBtn">Send reset link</button>
    </form>
    <div style="text-align:center; margin-top:16px;"><a class="btn-link" href="login.html">&larr; Back to sign in</a></div>
  </main>
</div>
<script type="module" src="js/pages/auth/forgotPassword.js"></script>
</body>
</html>
