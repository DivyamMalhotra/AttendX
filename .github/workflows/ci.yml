name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: Install backend
        run: npm ci
        working-directory: backend
      - name: Install frontend
        run: npm ci
        working-directory: frontend
      - name: Stylesheet bundle is current
        run: node scripts/build-css.js --check
        working-directory: frontend
      - name: Unit and integration tests (in-memory MongoDB)
        run: npm test
        working-directory: backend
      - name: Install Chromium for the browser tests
        run: npx playwright install --with-deps chromium
        working-directory: backend
      - name: End-to-end tests (backend + frontend together)
        run: npm run test:e2e
        working-directory: backend
        env:
          CI: "true"
          PW_CHANNEL: ""
      - name: Dependency audit (production)
        run: |
          npm audit --omit=dev --audit-level=high
          npm audit --omit=dev --audit-level=high --prefix ../frontend
        working-directory: backend
